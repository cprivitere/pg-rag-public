[project]
name = "pg-rag-builder"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "mwclient>=0.11.0",
    "mwparserfromhell>=0.7.2",
    "requests>=2.34.2",
    "tokenizers>=0.23",
]

[project.scripts]
pgrag = "pgrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgrag"]

[tool.hatch.build.targets.wheel.force-include]
"src/pgrag/resources" = "pgrag/resources"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load real CDN/wiki data (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
filterwarnings = [
    "ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning",
]