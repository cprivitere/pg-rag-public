[env]
# Portable paths - update this if mywebui moves
WEBUI_DIR = "F:/ProjectGorgon/mywebui"
# Logs directory
LOGS_DIR = "{{ config_root }}/logs"

[task_config]
# Default to PowerShell on Windows with -NoProfile (mise default)
shell = "pwsh -NoProfile -Command"
# Run tasks from project root by default
dir = "{{ config_root }}"
# Cascade to any child mise.toml files
cascade = true

[tasks.test]
description = "Run test suite"
run = "uv run -m pytest tests/"
alias = "te"

# --- Pipeline tasks ---

[tasks.refresh]
description = "Fast refresh: CDN data + rebuild documents + update vectorstore (skips slow wiki fetch)"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag build-documents",
  "uv run pgrag build-index",
]
alias = "rf"

[tasks."refresh-full"]
description = "Full refresh: CDN + wiki data + rebuild documents + update vectorstore"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag download-wiki",
  "uv run pgrag build-documents",
  "uv run pgrag build-index",
]

[tasks."refresh-cdn"]
description = "Download CDN data to data/cdn/"
run = "uv run pgrag download-cdn"

[tasks."refresh-wiki"]
description = "Download wiki pages to data/wiki/ (slow)"
run = "uv run pgrag download-wiki"

[tasks."refresh-documents"]
description = "Build data/documents.json from CDN + wiki data"
run = "uv run pgrag build-documents"

[tasks."refresh-vectors"]
description = "Upsert documents into ChromaDB index (refuses stale documents.json — run generate-docs or a sync-* task first)"
run = "uv run pgrag build-index"

[tasks."generate-docs"]
description = "Regenerate data/documents.json from CDN + wiki source (idempotent; stamps the generator version build-index checks)"
run = "uv run pgrag build-documents"
alias = "docs"

# --- Desired-state syncs: one command converges an index to current source ---
# Each runs build-documents first (which refreshes the generator-version
# marker) so build-index never consumes a stale documents.json.

[tasks."build-bm25"]
description = "Pre-warm/build the BM25 index (rebuilt + persisted when documents.json changed). Prevents the lazy first-query rebuild spike"
run = "uv run python -m pgrag.rag.bm25"
alias = "b25"

[tasks."sync-wiki"]
description = "Converge wiki index to current source: regenerate documents, then partial wiki re-embed (table records, parser/CACHE_VERSION changes), then BM25"
run = [
  "uv run pgrag build-documents",
  "uv run pgrag build-index --source wiki",
  "uv run python -m pgrag.rag.bm25",
]
alias = "syw"

[tasks."sync-cdn"]
description = "Converge CDN index to current source: fetch CDN, regenerate documents, partial CDN re-embed, then BM25"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag build-documents",
  "uv run pgrag build-index --source cdn",
  "uv run python -m pgrag.rag.bm25",
]
alias = "syc"

[tasks."sync"]
description = "Converge the whole index to current sources: fetch CDN + wiki, regenerate documents, full re-embed, then BM25"
run = [
  "uv run pgrag download-cdn",
  "uv run pgrag download-wiki",
  "uv run pgrag build-documents",
  "uv run pgrag build-index",
  "uv run python -m pgrag.rag.bm25",
]
alias = "sy"

[tasks.validate]
description = "Validate vectorstore health; rebuild if issues found"
run = "uv run pgrag validate && echo 'Index healthy' || (echo 'Rebuilding...' && uv run pgrag build-index)"
alias = "va"

[tasks.golden]
description = "Run golden eval set (needs embed + llm services up). Exits 1 on missing facts"
run = "uv run python scripts/golden_check.py"
alias = "gd"

[tasks."eval-retrieval"]
description = "Run pre-LLM retrieval evaluation suite (IR metrics: Recall@k, MRR, NDCG@k, Reranker Uplift)"
run = "uv run python scripts/retrieval_eval.py"
alias = "ev"

[tasks."eval-offline"]
description = "Run offline retrieval evaluation (BM25 + classifier + entity resolution without server dependencies)"
run = "uv run python scripts/retrieval_eval.py --offline"

[tasks."bakeoff-corpus"]
description = "Regenerate the embedder bake-off corpus (data/bakeoff_corpus.json) from current data/documents.json: up to ~500 sampled docs, 40-query / 3-tier set (needle / fill / paraphrase). Plain bake-off re-runs reuse the persisted corpus"
run = "uv run python scripts/bakeoff_corpus.py"
alias = "bkc"

[tasks.bakeoff]
description = "Run the embedder bake-off (all candidates): spawns each embedder on :8085, measures per-PID VRAM + MRR/Recall@10/NDCG@10/Hit@k, writes data/bakeoff_report.json. Self-contained; no services needed"
run = "uv run python scripts/embed_eval.py --bakeoff"
alias = "bk"

# --- Embedding server ---

# Debug/foreground commands
[tasks."debug-embed"]
description = "Start embedding server in foreground (debug)"
run = "llama-server -hf unsloth/bge-small-en-v1.5-GGUF:f16 --host 0.0.0.0 --port 8081 --embedding --pooling cls -ngl 99 --ubatch-size 8192 -np 1 -c 512"
alias = "dse"

# --- LLM server ---

[tasks."debug-llm"]
description = "Start LLM server in foreground (debug)"
run = "llama-server -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL --spec-type draft-mtp --spec-draft-n-max 4 -ngl 999 -fa on -c 16384 --reasoning-budget 1024 --host 0.0.0.0 --port 8080"
alias = "dsl"

# --- Open WebUI ---

[tasks."debug-webui"]
description = "Start Open WebUI in foreground (debug)"
run = "uv run --directory '{{ env.WEBUI_DIR }}' open-webui serve --port 3000"
dir = "{{ env.WEBUI_DIR }}"
alias = "dsw"

# --- Gradio chat ---

[tasks.chat]
description = "Run Gradio chat UI (requires embed + llm services up). Port 7860"
run = "uv run --with gradio python scripts/rag_chat.py"
alias = "chat"

# --- All services (background via file tasks in .mise/tasks/) ---

[tasks."start-all"]
description = "Start all services (embed + llm + rerank + webui) with logging"
depends = ["embed-start", "llm-start", "rerank-start", "webui-start"]
alias = "start"

[tasks."stop-all"]
description = "Stop all services (embed + llm + rerank + webui)"
depends = ["embed-stop", "llm-stop", "rerank-stop", "webui-stop"]
alias = "down"

# --- Status check ---

[tasks.status]
description = "Check status of all services (embed, llm, rerank, webui)"
run = "uv run python scripts/check_services.py"
alias = "st"

[tasks.drift]
description = "Check docs/skills against the repo: pointers resolve, contract constants match, TEST_CONTRACTS covers every test, golden counts are real"
run = "uv run python scripts/check_docs.py"
alias = "dr"

# --- Log viewing ---

[tasks.logs]
description = "List all log files in logs directory"
run = "Get-ChildItem '{{ env.LOGS_DIR }}' -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize"

[tasks."tail-embed"]
description = "Tail embedding server log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/embed.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tle"

[tasks."tail-llm"]
description = "Tail LLM server log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/llm.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tll"

[tasks."tail-webui"]
description = "Tail Open WebUI log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/webui.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tlw"

[tasks."tail-rerank"]
description = "Tail reranker server log (live, last 20 lines)"
run = "Get-Content '{{ env.LOGS_DIR }}/rerank.log' -ErrorAction SilentlyContinue -Wait -Tail 20"
alias = "tlr"
